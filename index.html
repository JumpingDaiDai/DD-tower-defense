<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fffdf5">
  <title>🏰 可愛塔防 - DD Tower Defense</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.3.0">
  <style>
    /* 強制確保頂部狀態列與底部卡槽為深棕琥珀色（非綠色） */
    #top-bar, #tower-panel {
      background: rgba(45, 30, 15, 0.78) !important;
      border: 1.5px solid rgba(255, 215, 0, 0.4) !important;
    }
    .btn-start {
      background: linear-gradient(135deg, #ff9800, #f57c00) !important;
      box-shadow: 0 2px 8px rgba(245, 124, 0, 0.4) !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- 頂部狀態列 (極簡乾淨：左數值、右出怪 + 設定齒輪) -->
    <div id="top-bar">
      <div class="top-bar-left">
        <div class="stat" title="金幣">
          <img class="stat-icon" src="assets/ui/icon_gold.svg" width="14" height="14" alt="金幣" />
          <span id="gold">200</span>
        </div>
        <div class="stat" title="生命">
          <img class="stat-icon" src="assets/ui/icon_heart.svg" width="14" height="14" alt="生命" />
          <span id="lives">20</span>
        </div>
        <div class="stat" title="波次"><span id="wave-info">準備中</span></div>
        <div class="stat" title="分數">
          <img class="stat-icon" src="assets/ui/icon_star.svg" width="14" height="14" alt="分數" />
          <span id="score">0</span>
        </div>
      </div>
      <div class="top-bar-right">
        <button id="speed-btn" title="遊戲速度">1x</button>
        <button id="settings-btn" class="btn-gear" title="設定">
          <img src="assets/ui/icon_settings.svg" width="16" height="16" alt="設定" />
        </button>
      </div>
    </div>

    <!-- 遊戲畫布視區 -->
    <div id="game-viewport">
      <canvas id="game-canvas"></canvas>

      <!-- 玩家主動技能快捷欄 (浮動在畫布右下方，專屬手繪 Canvas 魔法圖示) -->
      <div id="skill-bar">
        <button id="skill-meteor-btn" class="skill-btn" title="流星轟炸 (冷卻 30s)">
          <canvas id="skill-canvas-meteor" width="36" height="36" class="skill-mini-canvas"></canvas>
          <span class="skill-cd-overlay"></span>
          <span class="skill-cd-text"></span>
        </button>
        <button id="skill-freeze-btn" class="skill-btn" title="絕對零度 (冷卻 45s)">
          <canvas id="skill-canvas-freeze" width="36" height="36" class="skill-mini-canvas"></canvas>
          <span class="skill-cd-overlay"></span>
          <span class="skill-cd-text"></span>
        </button>
      </div>
    </div>

    <!-- 底部專屬防禦塔選擇面板 (拖曳塔或技能時，動態切換為取消區塊) -->
    <div id="tower-panel">
      <div id="tower-list"></div>
      <div id="tower-cancel-zone" class="hidden">
        <span id="cancel-zone-text" class="cancel-text">取消建設</span>
      </div>
    </div>

    <!-- 塔資訊面板 -->
    <div id="tower-info" class="hidden">
      <button id="close-info-btn" class="btn-close">✕</button>
      <h4 id="tower-info-name"></h4>
      <p id="tower-info-level"></p>
      <div id="tower-info-stats"></div>
      <div id="tower-info-actions">
        <button id="upgrade-btn" class="btn-upgrade">⬆️ 升級</button>
        <button id="sell-btn" class="btn-sell">💰 出售</button>
      </div>
    </div>

    <!-- 設定與暫停彈窗 (點擊齒輪時暫停遊戲) -->
    <div id="settings-screen" class="screen hidden">
      <div class="screen-content settings-modal-content">
        <img class="title-emoji" src="assets/ui/icon_settings.svg" width="30" height="30" alt="設定" />
        <h2>遊戲設定</h2>
        <div class="settings-options-list">
          <button id="settings-sound-btn" class="btn-settings-opt">
            <span class="settings-opt-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
            <span class="settings-opt-text" id="sound-status-text">音效：開啟</span>
          </button>
          <button id="settings-fullscreen-btn" class="btn-settings-opt">
            <span class="settings-opt-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></span>
            <span class="settings-opt-text">切換全螢幕</span>
          </button>
          <button id="settings-retry-btn" class="btn-settings-opt btn-opt-warning">
            <span class="settings-opt-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></span>
            <span class="settings-opt-text">重試關卡</span>
          </button>
          <button id="settings-quit-btn" class="btn-settings-opt btn-opt-danger">
            <span class="settings-opt-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9.09 12.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.76 2.59z"/></svg></span>
            <span class="settings-opt-text">退出關卡（返回首頁）</span>
          </button>
        </div>
        <button id="settings-resume-btn" class="btn-primary" style="margin-top: 14px;">
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <span>繼續遊戲</span>
        </button>
      </div>
    </div>

    <!-- 通知 Toast -->
    <div id="toast-container"></div>

    <!-- 開始畫面 -->
    <div id="menu-screen" class="screen">
      <div class="screen-content">
        <div id="menu-version-badge" class="menu-version-badge"></div>
        <div class="title-illustration">
          <canvas id="menu-title-canvas" width="80" height="80"></canvas>
        </div>
        <h1>可愛塔防</h1>
        <p class="subtitle">保護花園不被可愛小怪物們攻陷！</p>

        <!-- 首頁高分榜 (僅展示第一名，點擊開啟完整英雄榜) -->
        <div id="open-leaderboard-btn" class="menu-champion-card" title="點擊查看 Top 10 英雄榜">
          <div class="champion-left">
            <img class="ui-icon-gold" src="assets/ui/icon_trophy.svg" width="22" height="22" alt="獎盃" />
            <div class="champion-info">
              <span class="champion-label">歷史榜首紀錄</span>
              <span id="menu-champion-desc" class="champion-desc">尚無紀錄</span>
            </div>
          </div>
          <div class="champion-right">
            <span id="menu-champion-score" class="champion-score">0</span>
            <span class="champion-arrow">›</span>
          </div>
        </div>

        <!-- 商店入口 (用永久貨幣「魔法水晶」解鎖塔與技能) -->
        <div id="open-shop-btn" class="menu-champion-card" title="點擊開啟商店">
          <div class="champion-left">
            <span class="shop-crystal-icon">💎</span>
            <div class="champion-info">
              <span class="champion-label">魔法水晶</span>
              <span id="menu-crystal-balance" class="champion-desc">0</span>
            </div>
          </div>
          <div class="champion-right">
            <span class="champion-score" style="font-size:13px;">商店</span>
            <span class="champion-arrow">›</span>
          </div>
        </div>

        <!-- 關卡輪探 -->
        <div class="level-carousel">
          <button id="level-prev-btn" class="level-arrow-btn" aria-label="上一關">‹</button>
          <div class="level-carousel-card" id="level-carousel-card">
            <div class="level-card-lock hidden" id="level-lock-overlay">🔒</div>
            <div class="level-card-name" id="level-card-name"></div>
            <div class="level-card-stars" id="level-card-stars"></div>
            <div class="level-star-tip hidden" id="level-star-tip"></div>
          </div>
          <button id="level-next-btn" class="level-arrow-btn" aria-label="下一關">›</button>
        </div>

        <button id="start-btn" class="btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <span>開始守衛</span>
        </button>
      </div>
    </div>

    <!-- 獨立 Top 10 英雄榜彈窗 (支援高分榜與通關金幣榜) -->
    <div id="leaderboard-modal" class="screen hidden">
      <div class="screen-content leaderboard-modal-content">
        <img class="ui-icon-gold" src="assets/ui/icon_trophy.svg" width="36" height="36" alt="獎盃" style="margin-bottom:4px;" />
        <h2 style="margin-bottom:8px;">榮譽英雄榜 Top 10</h2>
        
        <!-- 排行榜分頁切換按鈕 -->
        <div class="leaderboard-tabs">
          <button id="lb-tab-score" class="lb-tab-btn active">⭐ 高分榜</button>
          <button id="lb-tab-gold" class="lb-tab-btn">💰 通關金幣榜</button>
        </div>

        <div class="leaderboard-modal-card">
          <div id="modal-leaderboard-list" class="leaderboard-modal-records"></div>
        </div>
        <button id="close-leaderboard-btn" class="btn-primary" style="margin-top: 14px;">關閉英雄榜</button>
      </div>
    </div>

    <!-- 商店彈窗：用魔法水晶永久解鎖塔與技能 -->
    <div id="shop-modal" class="screen hidden">
      <div class="screen-content leaderboard-modal-content">
        <div class="shop-balance-row">💎 <span id="shop-crystal-balance">0</span></div>
        <h2 style="margin-bottom:8px;">塔與技能商店</h2>
        <div class="leaderboard-modal-card">
          <div id="shop-item-list" class="shop-item-list"></div>
        </div>
        <div class="shop-item-info hidden" id="shop-item-info"></div>
        <button id="close-shop-btn" class="btn-primary" style="margin-top: 14px;">關閉商店</button>
      </div>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="gameover-screen" class="screen hidden">
      <div class="screen-content end-game-content">
        <div class="end-illustration">
          <canvas id="gameover-canvas" width="70" height="70"></canvas>
        </div>
        <h1>花園淪陷了</h1>
        <p class="end-subtitle">你撐到了第 <span id="final-wave" class="stat-highlight">0</span> 波</p>
        <div class="end-score-box">
          <span class="end-score-label">最終得分</span>
          <span id="final-score" class="end-score-val">0</span>
        </div>

        <div class="end-action-buttons">
          <button id="retry-btn" class="btn-end-action btn-end-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span>再試一次</span>
          </button>
          <button id="gameover-menu-btn" class="btn-end-action btn-end-secondary">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>返回首頁</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 勝利畫面 -->
    <div id="victory-screen" class="screen hidden">
      <div class="screen-content end-game-content">
        <div class="end-illustration">
          <canvas id="victory-canvas" width="70" height="70"></canvas>
        </div>
        <h1>花園保衛成功！</h1>
        <p class="end-subtitle">恭喜擊退所有入侵波次！</p>
        <div id="victory-stars" class="victory-stars"></div>
        <div id="victory-chest-reward" class="victory-chest-reward hidden"></div>
        <div class="end-score-box">
          <div style="display:flex; justify-content:space-around; align-items:center; width:100%;">
            <div>
              <span class="end-score-label">最終得分</span>
              <span id="victory-score" class="end-score-val">0</span>
            </div>
            <div style="border-left:1.5px dashed #ffd54f; height:32px; margin:0 8px;"></div>
            <div>
              <span class="end-score-label">剩餘金幣</span>
              <span id="victory-gold" class="end-score-val" style="color:#d84315;">💰 0</span>
            </div>
          </div>
        </div>

        <div class="end-action-buttons">
          <button id="replay-btn" class="btn-end-action btn-end-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span>再玩一次</span>
          </button>
          <button id="victory-menu-btn" class="btn-end-action btn-end-secondary">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>返回首頁</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Debug: 浮動 Log 按鈕、日誌面板、截圖按鈕。 -->
  <div id="debug-container" style="position:fixed;bottom:10px;right:10px;z-index:99999;">
    <button id="debug-toggle-btn" style="background:#222;color:#00ff66;border:1px solid #00ff66;padding:4px 10px;border-radius:12px;font-size:11px;font-family:monospace;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);touch-action:manipulation;" onclick="const l=document.getElementById('debug-log'); l.style.display = (l.style.display==='none'||l.style.display==='')?'block':'none';">
      🐞 Log
    </button>
    <button id="debug-shot-btn" style="background:#222;color:#ffcc00;border:1px solid #ffcc00;padding:4px 10px;border-radius:12px;font-size:11px;font-family:monospace;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);margin-left:4px;touch-action:manipulation;" onclick="if(window.dbgUploadScreenshot) dbgUploadScreenshot();">
      📷 傳截圖
    </button>
    <button id="debug-test-toggle-btn" style="background:#222;color:#00bcd4;border:1px solid #00bcd4;padding:4px 10px;border-radius:12px;font-size:11px;font-family:monospace;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);margin-left:4px;touch-action:manipulation;" onclick="const l=document.getElementById('debug-test-panel'); l.style.display = (l.style.display==='none'||l.style.display==='')?'block':'none';">
      🧪 關卡
    </button>
    <div id="debug-log" style="display:none;position:absolute;bottom:32px;right:0;width:280px;max-height:180px;background:rgba(0,0,0,0.92);color:#00ff66;font-family:monospace;font-size:10px;padding:8px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.4);border:1px solid #333;overflow-y:auto;pointer-events:auto;">
      <div style="border-bottom:1px solid #444;padding-bottom:4px;margin-bottom:4px;font-weight:bold;">
        📋 系統偵錯日誌
      </div>
    </div>
    <div id="debug-test-panel" style="display:none;position:absolute;bottom:32px;right:0;width:200px;background:rgba(0,0,0,0.92);color:#fff;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.4);border:1px solid #333;">
      <div style="border-bottom:1px solid #444;padding-bottom:4px;margin-bottom:6px;font-weight:bold;color:#00bcd4;">
        🧪 關卡進度測試
      </div>
      <select id="debug-level-select" style="width:100%;margin-bottom:6px;padding:3px;">
        <option value="-1">尚未通關任何關卡</option>
        <option value="0">通關第 1 關</option>
        <option value="1">通關第 2 關</option>
        <option value="2">通關第 3 關</option>
      </select>
      <select id="debug-stars-select" style="width:100%;margin-bottom:8px;padding:3px;">
        <option value="1">1 ★</option>
        <option value="2">2 ★</option>
        <option value="3" selected>3 ★</option>
      </select>
      <button style="width:100%;background:#00bcd4;color:#000;border:none;padding:5px;border-radius:4px;font-weight:bold;cursor:pointer;" onclick="if(window.dbgApplyLevelProgress) window.dbgApplyLevelProgress(parseInt(document.getElementById('debug-level-select').value, 10), parseInt(document.getElementById('debug-stars-select').value, 10));">
        套用
      </button>
    </div>
  </div>

  <script src="game.js?v=1.3.0"></script>
</body>
</html>
