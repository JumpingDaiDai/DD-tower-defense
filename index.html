<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#deb887">
  <title>🏰 可愛塔防 - DD Tower Defense</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?t=202608230422">
  <style>
    /* 強制確保頂部狀態列與底部卡槽為深棕琥珀色（非綠色） */
    #top-bar, #tower-panel {
      background: rgba(45, 30, 15, 0.78) !important;
      border: 1.5px solid rgba(255, 215, 0, 0.4) !important;
    }
    .btn-start {
      background: linear-gradient(135deg, #ff9800, #f57c00) !important;
      box-shadow: 0 2px 8px rgba(245, 124, 0, 0.4) !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- 版本標籤 -->
    <div id="app-version">v1.0.0 Official Release</div>

    <!-- 頂部狀態列 (極簡乾淨：左數值、右出怪 + 設定齒輪) -->
    <div id="top-bar">
      <div class="top-bar-left">
        <div class="stat" title="金幣">💰 <span id="gold">200</span></div>
        <div class="stat" title="生命">❤️ <span id="lives">20</span></div>
        <div class="stat" title="波次"><span id="wave-info">準備中</span></div>
        <div class="stat" title="分數">⭐ <span id="score">0</span></div>
      </div>
      <div class="top-bar-right">
        <button id="speed-btn" title="遊戲速度">1x</button>
        <button id="start-wave-btn" class="btn-start">出怪</button>
        <button id="settings-btn" class="btn-gear" title="設定">⚙️</button>
      </div>
    </div>

    <!-- 遊戲畫布視區 -->
    <div id="game-viewport">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- 底部專屬防禦塔選擇面板 (100% 空間全給塔卡片，不再被開始按鈕遮擋) -->
    <div id="tower-panel">
      <div id="tower-list"></div>
    </div>

    <!-- 塔資訊面板 -->
    <div id="tower-info" class="hidden">
      <button id="close-info-btn" class="btn-close">✕</button>
      <h4 id="tower-info-name"></h4>
      <p id="tower-info-level"></p>
      <div id="tower-info-stats"></div>
      <div id="tower-info-actions">
        <button id="upgrade-btn" class="btn-upgrade">⬆️ 升級</button>
        <button id="sell-btn" class="btn-sell">💰 出售</button>
      </div>
    </div>

    <!-- 設定與暫停彈窗 (點擊齒輪時暫停遊戲) -->
    <div id="settings-screen" class="screen hidden">
      <div class="screen-content settings-modal-content">
        <div class="title-emoji">⚙️</div>
        <h2>遊戲設定</h2>
        <div class="settings-options-list">
          <button id="settings-sound-btn" class="btn-settings-opt">
            <span class="settings-opt-icon">🔊</span>
            <span class="settings-opt-text" id="sound-status-text">音效：開啟</span>
          </button>
          <button id="settings-fullscreen-btn" class="btn-settings-opt">
            <span class="settings-opt-icon">⛶</span>
            <span class="settings-opt-text">切換全螢幕</span>
          </button>
          <button id="settings-retry-btn" class="btn-settings-opt btn-opt-warning">
            <span class="settings-opt-icon">🔄</span>
            <span class="settings-opt-text">重試關卡</span>
          </button>
          <button id="settings-quit-btn" class="btn-settings-opt btn-opt-danger">
            <span class="settings-opt-icon">🚪</span>
            <span class="settings-opt-text">退出關卡（返回首頁）</span>
          </button>
        </div>
        <button id="settings-resume-btn" class="btn-primary" style="margin-top: 14px;">▶️ 繼續遊戲</button>
      </div>
    </div>

    <!-- 通知 Toast -->
    <div id="toast-container"></div>

    <!-- 開始畫面 -->
    <div id="menu-screen" class="screen">
      <div class="screen-content">
        <div class="menu-version-badge">✨ 正式版 v1.0.0</div>
        <div class="title-emoji">🏰</div>
        <h1>可愛塔防</h1>
        <p class="subtitle">保護花園不被可愛小怪物們攻陷！</p>

        <!-- 首頁高分榜 -->
        <div class="menu-leaderboard-card">
          <span class="leaderboard-icon">🏆</span>
          <span class="leaderboard-label">歷史最高分：</span>
          <span class="leaderboard-score" id="menu-best-score">0</span>
        </div>

        <!-- 地圖選擇器 -->
        <div class="map-selection-container">
          <div class="map-selection-header">🗺️ 選擇戰場地圖</div>
          <div id="map-selection-list"></div>
        </div>

        <button id="start-btn" class="btn-primary">🎮 開始遊戲</button>
      </div>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="gameover-screen" class="screen hidden">
      <div class="screen-content">
        <div class="title-emoji">💔</div>
        <h1>花園淪陷了！</h1>
        <p>你撐到了第 <span id="final-wave">0</span> 波</p>
        <p>最終得分：<span id="final-score">0</span></p>
        <button id="retry-btn" class="btn-primary">🔄 再試一次</button>
      </div>
    </div>

    <!-- 勝利畫面 -->
    <div id="victory-screen" class="screen hidden">
      <div class="screen-content">
        <div class="title-emoji">🎉</div>
        <h1>花園保衛成功！</h1>
        <p>恭喜通關所有 15 波！</p>
        <p>最終得分：<span id="victory-score">0</span></p>
        <button id="replay-btn" class="btn-primary">🔄 再玩一次</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
