<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#d3f9d8">
  <title>🏰 可愛塔防 - DD Tower Defense</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?t=202608230405">
</head>
<body>
  <div id="game-container">
    <!-- 版本標籤 -->
    <div id="app-version">v3.3.1 (Clean Top Bar & No Wave Arrows)</div>

    <!-- 頂部狀態列 -->
    <div id="top-bar">
      <div class="top-bar-left">
        <div class="stat" title="金幣">💰 <span id="gold">200</span></div>
        <div class="stat" title="生命">❤️ <span id="lives">20</span></div>
        <div class="stat" title="波次"><span id="wave-info">準備中</span></div>
        <div class="stat" title="分數">⭐ <span id="score">0</span></div>
        <div class="stat best-score" title="最高分">🏆 <span id="best-score">0</span></div>
      </div>
      <div class="top-bar-right">
        <button id="start-wave-btn" class="btn-start">出怪</button>
        <div class="controls">
          <button id="speed-btn" title="遊戲速度">⏩ 1x</button>
          <button id="sound-btn" title="音效">🔊</button>
          <button id="fullscreen-btn" title="全螢幕">⛶</button>
        </div>
      </div>
    </div>

    <!-- 遊戲畫布視區 -->
    <div id="game-viewport">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- 底部專屬防禦塔選擇面板 (100% 空間全給塔卡片，不再被開始按鈕遮擋) -->
    <div id="tower-panel">
      <div id="tower-list"></div>
    </div>

    <!-- 塔資訊面板 -->
    <div id="tower-info" class="hidden">
      <button id="close-info-btn" class="btn-close">✕</button>
      <h4 id="tower-info-name"></h4>
      <p id="tower-info-level"></p>
      <div id="tower-info-stats"></div>
      <div id="tower-info-actions">
        <button id="upgrade-btn" class="btn-upgrade">⬆️ 升級</button>
        <button id="sell-btn" class="btn-sell">💰 出售</button>
      </div>
    </div>

    <!-- 浮動 Log 按鈕與日誌面板與截圖按鈕 -->
    <div id="debug-container" style="position:fixed;bottom:10px;right:10px;z-index:99999;display:flex;gap:4px;align-items:center;">
      <button id="debug-toggle-btn" style="background:#222;color:#00ff66;border:1px solid #00ff66;padding:4px 10px;border-radius:12px;font-size:11px;font-family:monospace;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);touch-action:manipulation;" onclick="const l=document.getElementById('debug-log'); l.style.display = (l.style.display==='none'||l.style.display==='')?'block':'none';">
        🐞 Log
      </button>
      <button id="debug-shot-btn" style="background:#222;color:#ffcc00;border:1px solid #ffcc00;padding:4px 10px;border-radius:12px;font-size:11px;font-family:monospace;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);touch-action:manipulation;" onclick="if(window.dbgUploadScreenshot) dbgUploadScreenshot();">
        📷 截圖
      </button>
      <div id="debug-log" style="display:none;position:absolute;bottom:32px;right:0;width:280px;max-height:180px;background:rgba(0,0,0,0.92);color:#00ff66;font-family:monospace;font-size:10px;padding:8px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.4);border:1px solid #333;overflow-y:auto;pointer-events:auto;">
        <div style="border-bottom:1px solid #444;padding-bottom:4px;margin-bottom:4px;font-weight:bold;">
          📋 系統偵錯日誌
        </div>
      </div>
    </div>

    <!-- 通知 Toast -->
    <div id="toast-container"></div>

    <!-- 開始畫面 -->
    <div id="menu-screen" class="screen">
      <div class="screen-content">
        <div class="menu-version-badge">v3.3.1 (Clean Top Bar & No Wave Arrows)</div>
        <div class="title-emoji">🏰</div>
        <h1>可愛塔防</h1>
        <p class="subtitle">保護花園不被可愛小怪物們攻陷！</p>

        <!-- 地圖選擇器 -->
        <div class="map-selection-container">
          <div class="map-selection-header">🗺️ 選擇戰場地圖</div>
          <div id="map-selection-list"></div>
        </div>

        <button id="start-btn" class="btn-primary">🎮 開始遊戲</button>
      </div>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="gameover-screen" class="screen hidden">
      <div class="screen-content">
        <div class="title-emoji">💔</div>
        <h1>花園淪陷了！</h1>
        <p>你撐到了第 <span id="final-wave">0</span> 波</p>
        <p>最終得分：<span id="final-score">0</span></p>
        <button id="retry-btn" class="btn-primary">🔄 再試一次</button>
      </div>
    </div>

    <!-- 勝利畫面 -->
    <div id="victory-screen" class="screen hidden">
      <div class="screen-content">
        <div class="title-emoji">🎉</div>
        <h1>花園保衛成功！</h1>
        <p>恭喜通關所有 15 波！</p>
        <p>最終得分：<span id="victory-score">0</span></p>
        <button id="replay-btn" class="btn-primary">🔄 再玩一次</button>
      </div>
    </div>
  </div>

  <script>
    // 全域直接監聽，確認手指點擊了畫面上哪個元素（靜默記錄至 Log 面板）
    window.addEventListener('click', function(e) {
      const msg = `🎯 Tap: <${e.target.tagName} id="${e.target.id}">`;
      if (window.dbgLog) {
        window.dbgLog(msg);
      } else {
        const dbg = document.getElementById('debug-log');
        if (dbg) {
          const d = document.createElement('div');
          d.textContent = msg;
          dbg.appendChild(d);
        }
      }
    }, true);

    // 動態載入帶有即時時間戳記的 game.js，完全繞過任何快取
    const script = document.createElement('script');
    script.src = 'game.js?t=' + Date.now();
    document.body.appendChild(script);
  </script>
</body>
</html>
