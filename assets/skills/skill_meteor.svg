<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="metCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="35%" stop-color="#ffee58"/>
      <stop offset="65%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </radialGradient>
    <linearGradient id="metTailOuter" x1="100%" y1="0%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#ff6d00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metTailInner" x1="100%" y1="0%" x2="30%" y2="85%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#ffab00" stop-opacity="0"/>
