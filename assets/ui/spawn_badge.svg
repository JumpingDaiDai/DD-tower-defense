<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 50" width="140" height="50">
  <defs>
    <linearGradient id="cleanBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="50%" stop-color="#f4511e"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#badgeShadow)">
    <!-- 僅保留純膠囊底框背景 (純背景圖片) -->
    <rect x="4" y="4" width="132" height="42" rx="21" fill="url(#cleanBadgeGrad)" stroke="#ffe082" stroke-width="2.5"/>
  </g>
</svg>
