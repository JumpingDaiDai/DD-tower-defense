<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff3d6"/>
    </linearGradient>
  </defs>

  <!-- 貼地柔光陰影 -->
  <ellipse cx="50" cy="93" rx="38" ry="5" fill="rgba(0,0,0,0.14)"/>

  <!-- 石台平台本體 -->
  <rect x="6" y="6" width="88" height="84" rx="10" fill="url(#stoneGrad)"/>

  <!-- 金色細緻收邊 -->
  <rect x="7.5" y="7.5" width="85" height="79" rx="8" fill="none" stroke="rgba(255,167,38,0.55)" stroke-width="1.6"/>

  <!-- 四角精緻古典刻痕 -->
  <rect x="12" y="12" width="4" height="4" fill="rgba(255,152,0,0.35)"/>
  <rect x="84" y="12" width="4" height="4" fill="rgba(255,152,0,0.35)"/>
  <rect x="12" y="80" width="4" height="4" fill="rgba(255,152,0,0.35)"/>
  <rect x="84" y="80" width="4" height="4" fill="rgba(255,152,0,0.35)"/>
</svg>
