<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="portalBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="60%" stop-color="#311b92"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </radialGradient>
    <radialGradient id="vortexCore" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ea80fc"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </radialGradient>
  </defs>
  
  <!-- 陰影 -->
  <ellipse cx="50" cy="82" rx="36" ry="12" fill="rgba(0,0,0,0.35)"/>
  
  <!-- 八角星石陣魔法陣 -->
  <circle cx="50" cy="50" r="38" fill="url(#portalBg)" stroke="#b388ff" stroke-width="3"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#ea80fc" stroke-width="1.8" stroke-dasharray="6,4"/>
  <circle cx="50" cy="50" r="16" fill="url(#vortexCore)"/>

  <!-- 旋轉漩渦線條 -->
  <path d="M 50,50 Q 65,35 70,50 Q 65,65 50,50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="M 50,50 Q 35,65 30,50 Q 35,35 50,50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- 左右黑曜石尖碑 -->
  <!-- 左尖碑 -->
  <polygon points="22,75 16,28 24,16 32,32 28,75" fill="#212121" stroke="#7c4dff" stroke-width="1.5"/>
  <polygon points="24,14 27,6 24,-2 21,6" fill="#e040fb"/>

  <!-- 右尖碑 -->
  <polygon points="78,75 72,32 76,16 84,28 78,75" fill="#212121" stroke="#7c4dff" stroke-width="1.5"/>
  <polygon points="76,14 79,6 76,-2 73,6" fill="#e040fb"/>
</svg>
