  <ellipse cx="58" cy="26" rx="12" ry="20" fill="rgba(225, 245, 254, 0.85)" stroke="#81d4fa" stroke-width="1.8" transform="rotate(20 58 26)"/>
  <!-- 蜜蜂圓潤主體 -->
  <ellipse cx="50" cy="54" rx="28" ry="22" fill="url(#beeGrad)" stroke="#e65100" stroke-width="2.5"/>
