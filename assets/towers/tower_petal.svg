<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="baseG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="70%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </radialGradient>
    <linearGradient id="roofG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- 圓形基座 -->
    <ellipse cx="50" cy="72" rx="38" ry="18" fill="rgba(0,0,0,0.2)"/>
    <ellipse cx="50" cy="68" rx="36" ry="16" fill="url(#baseG)" stroke="#f57c00" stroke-width="3"/>
    <!-- 木柱 -->
    <rect x="36" y="32" width="8" height="32" rx="3" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/>
    <rect x="56" y="32" width="8" height="32" rx="3" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/>
    <!-- 綠穹頂 -->
    <path d="M 20,36 Q 50,8 80,36 Z" fill="url(#roofG)" stroke="#1b5e20" stroke-width="3"/>
    <!-- 弩弓神射手標籤 -->
    <path d="M 32,46 Q 50,30 68,46" fill="none" stroke="#ffd54f" stroke-width="5" stroke-linecap="round"/>
    <line x1="32" y1="46" x2="68" y2="46" stroke="#ffffff" stroke-width="2"/>
    <polygon points="50,26 56,42 44,42" fill="#ff1744"/>
  </g>
</svg>
