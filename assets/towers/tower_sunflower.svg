<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sunPetalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="60%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </radialGradient>
    <radialGradient id="sunCoreGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="70%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
  </defs>
  <!-- 陰影 -->
  <ellipse cx="50" cy="84" rx="32" ry="9" fill="rgba(0,0,0,0.25)"/>
  <!-- 白石金紋石底座 -->
  <rect x="22" y="70" width="56" height="14" rx="5" fill="#f5f5f5" stroke="#ffb300" stroke-width="2"/>
  <!-- 翡翠花莖 -->
  <path d="M 50,70 L 50,48" stroke="#4caf50" stroke-width="8" stroke-linecap="round"/>
  <!-- 向日葵黃色太陽花瓣 (12瓣) -->
  <g transform="translate(50,38)">
    <!-- 圓周旋轉 12 瓣 -->
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(30)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(60)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(90)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(120)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(150)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(180)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(210)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(240)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(270)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(300)"/>
    <path d="M 0,0 L -6,-28 A 6 6 0 0 1 6,-28 Z" fill="url(#sunPetalGrad)" stroke="#ff8f00" stroke-width="1" transform="rotate(330)"/>
    <!-- 中央棕色笑臉花蕊 -->
    <circle cx="0" cy="0" r="14" fill="url(#sunCoreGrad)" stroke="#ffb300" stroke-width="2"/>
    <circle cx="-5" cy="-3" r="2" fill="#ffd54f"/>
    <circle cx="5" cy="-3" r="2" fill="#ffd54f"/>
    <path d="M -5,4 Q 0,8 5,4" fill="none" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
