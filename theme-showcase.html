          <div class="theme-sub" style="color:${t.border};">${t.tag}</div>

          <div class="palette-row">
            ${t.swatches.map(s => `<div class="swatch" style="background:${s};" title="${s}"></div>`).join('')}
          </div>

          <div class="mockup-viewport" style="background:${t.bg}; border-color:${t.border}44;">
            <div class="mockup-top-bar" style="background:${t.panel}; border:1.5px solid ${t.border}55;">
              <div class="mockup-stat-chip" style="background:${t.statBg}; color:${t.statColor}; border:1px solid ${t.border}44;">💎 200</div>
              <div class="mockup-stat-chip" style="background:${t.statBg}; color:${t.statColor}; border:1px solid ${t.border}44;">❤️ 20</div>
              <div class="mockup-stat-chip" style="background:${t.statBg}; color:${t.statColor}; border:1px solid ${t.border}44;">W1/15</div>
            </div>

            <div class="mockup-canvas-area" style="background:${t.canvasBg}; border:1.5px solid ${t.border}44;">
              <canvas id="mini-cv-${t.id}" width="70" height="70"></canvas>
            </div>

            <div class="mockup-tower-panel" style="background:${t.panel}; border:1.5px solid ${t.border}55;">
              <div class="mockup-card-slot" style="background:${t.statBg}; border:1px solid ${t.border}66; color:#333;"><span>花瓣</span><span style="color:${t.statColor};">100</span></div>
              <div class="mockup-card-slot" style="background:${t.statBg}; border:1px solid ${t.border}66; color:#333;"><span>冰淇淋</span><span style="color:${t.statColor};">150</span></div>
              <div class="mockup-card-slot" style="background:${t.statBg}; border:1px solid ${t.border}66; color:#333;"><span>向日葵</span><span style="color:${t.statColor};">75</span></div>
            </div>
          </div>

          <button class="mockup-btn" style="background:${t.btnBg}; color:${t.btnColor}; box-shadow:0 3px 0 rgba(0,0,0,0.15);">守衛世界樹</button>
          <div class="theme-desc">${t.desc}</div>
        `;

        container.appendChild(card);

        // Mini canvas crystal tree rendering
        setTimeout(() => {
          const cv = document.getElementById('mini-cv-' + t.id);
          if (cv) {
            const ctx = cv.getContext('2d');
            ctx.translate(35, 42);
            ctx.scale(0.72, 0.72);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.beginPath(); ctx.ellipse(0, 20, 26, 9, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'rgba(0, 229, 255, 0.25)'; ctx.strokeStyle = t.border; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.roundRect(-22, 10, 44, 12, 4); ctx.fill(); ctx.stroke();

            const tcGrad = ctx.createLinearGradient(-16, 0, 16, 0);
            tcGrad.addColorStop(0, '#80d8ff'); tcGrad.addColorStop(0.5, '#ffffff'); tcGrad.addColorStop(1, '#00b0ff');
            ctx.fillStyle = tcGrad;
            ctx.beginPath(); ctx.moveTo(-9, 10); ctx.lineTo(-24, -22); ctx.lineTo(0, -38); ctx.lineTo(24, -22); ctx.lineTo(9, 10); ctx.closePath(); ctx.fill();

            const facets = [
              { p: [[0, -38], [-24, -22], [-12, -8], [0, -18]], c: '#e1f5fe' },
              { p: [[0, -38], [24, -22], [12, -8], [0, -18]], c: '#b3e5fc' },
              { p: [[0, -18], [-12, -8], [0, 8]], c: '#4fc3f7' },
              { p: [[0, -18], [12, -8], [0, 8]], c: '#29b6f6' }
            ];
            for (let tf of facets) {
              ctx.fillStyle = tf.c; ctx.beginPath();
              tf.p.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
              ctx.closePath(); ctx.fill();
              ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)'; ctx.lineWidth = 0.8; ctx.stroke();
            }

            ctx.shadowColor = t.border; ctx.shadowBlur = 8;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(0, -42, 5.5, 0, Math.PI * 2); ctx.fill();
          }
        }, 10);
      });
    });
  </script>
</body>
</html>
